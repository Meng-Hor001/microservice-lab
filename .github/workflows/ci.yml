name: Business Service CI/CD

on:
  push:
    branches: ["Assignment-01"]
  pull_request:
    branches: ["Assignment-01"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build business service
        run: >
          bash ./gradlew
          :microservices:business-service:business-service-main:build
          --no-daemon
          --console=plain