spring:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  datasource:
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: 1234
    url: jdbc:postgresql://localhost:5432/microservice_db
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  application:
    name: microservice-lab
server:
  port: 9292