payment-service:
  base-url: ${PAYMENT_SERVICE_BASE_URL:http://localhost:8484}


spring:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  datasource:
    driver-class-name: org.postgresql.Driver
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
    url: ${POSTGRES_URL}
  application:
    name: microservice-lab
server:
  port: 9292



