plugins {
    id 'springboot-common-conventions'
}

dependencyManagement {
    imports {
        mavenBom 'org.springframework.cloud:spring-cloud-dependencies:2025.1.4'
    }
}
dependencies {
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'com.scalar.maven:scalar:0.4.4'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-api:3.1.1'
    implementation 'kh.edu.istad:customer-domain-core'
    implementation 'kh.edu.istad:customer-application-service'
    implementation 'kh.edu.istad:customer-service-message'
    implementation 'kh.edu.istad:customer-service-persistence'
    implementation 'kh.edu.istad:customer-service-restapi'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    runtimeOnly 'org.postgresql:postgresql'
}

