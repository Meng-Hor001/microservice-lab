plugins {
    id 'spring-common-conventions'
}

group = 'com.edu.kh'
version = 'unspecified'

repositories {
    mavenCentral()
}

dependencies {
    api project(':order-service-domain:order-domain-core')

    implementation 'org.springframework:spring-tx:7.0.9'
    implementation 'org.springframework:spring-context:7.0.9'

}

test {
    useJUnitPlatform()
}