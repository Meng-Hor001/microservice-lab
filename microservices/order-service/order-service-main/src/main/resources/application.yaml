server:
  port: ${ORDER_PORT:8083}
spring:
  application:
    name: order-service
  datasource:
    url: ${ORDER_DATABASE_URL:jdbc:postgresql://localhost:5433/order_db}
    username: ${ORDER_DATABASE_USERNAME:order_user}
    password: ${ORDER_DATABASE_PASSWORD:order_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
