plugins {
    id 'springboot-common-conventions'
}

dependencyManagement {
    imports {
        mavenBom 'org.springframework.cloud:spring-cloud-dependencies:2025.1.4'
    }
}

dependencies {
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation project(':payment-service-restapi')
    implementation project(':payment-service-application')
    implementation project(':payment-service-domain')
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-api:3.1.1'
    implementation 'com.scalar.maven:scalar:0.4.4'
    runtimeOnly 'org.postgresql:postgresql'
}
