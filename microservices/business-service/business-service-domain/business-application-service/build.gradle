plugins {
    id 'spring-common-conventions'
}

group = 'com.edu.kh'
version = 'unspecified'

repositories {
    mavenCentral()
}

dependencies {
    api project(':business-service-domain')
    api 'io.projectreactor:reactor-core'
    implementation 'org.springframework:spring-context'
}

test {
    useJUnitPlatform()
}