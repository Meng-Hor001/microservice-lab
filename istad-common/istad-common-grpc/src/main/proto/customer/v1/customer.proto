syntax = "proto3";

package customer.v1;

option java_multiple_files = true;
option java_package = "kh.edu.istad.grpc.customer.v1";
option java_outer_classname = "CustomerProto";

// Customer lookup contract shared by the customer service and its gRPC clients.
service CustomerService {
  rpc GetCustomer(GetCustomerRequest) returns (GetCustomerResponse);
  rpc GetCustomerByUsername(GetCustomerByUsernameRequest) returns (GetCustomerResponse);
}

message GetCustomerRequest {
  // Customer identifier as the UUID string used by the platform.
  string username = 1;
}

message GetCustomerByUsernameRequest {
  string username = 1;
}

message GetCustomerResponse {
  string customer_id = 1;
  string username = 2;
  string given_name = 3;
  string family_name = 4;
  string email = 5;
  string phone_number = 6;
  CustomerStatus status = 7;
}

enum CustomerStatus {
  CUSTOMER_STATUS_UNSPECIFIED = 0;
  CUSTOMER_STATUS_ACTIVE = 1;
  CUSTOMER_STATUS_INACTIVE = 2;
}
