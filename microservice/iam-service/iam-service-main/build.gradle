plugins {
    id 'spring-boot-common-conventions'
}

dependencies {
    implementation libs.iam.domain.core
    implementation libs.iam.application.service
    implementation libs.iam.service.persistence
    implementation libs.iam.service.infrstructure
    implementation libs.iam.service.web
    implementation libs.iam.service.restapi



    implementation libs.spring.boot.starter.liquibase
    implementation libs.spring.boot.starter.data.jpa
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation platform('org.testcontainers:testcontainers-bom:1.21.3')
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
}

test {
    useJUnitPlatform()
}