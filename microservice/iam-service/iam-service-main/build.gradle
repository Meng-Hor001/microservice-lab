plugins {
    id 'spring-boot-common-conventions'
}

dependencies {
    implementation libs.iam.domain.core
    implementation libs.iam.application.service
    implementation libs.iam.service.persistence
    implementation libs.iam.service.infrstructure
    implementation libs.iam.service.web
    implementation libs.iam.service.restapi


    implementation libs.spring.boot.starter.liquibase
    implementation libs.spring.boot.starter.data.jpa
    runtimeOnly 'org.postgresql:postgresql'


    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
    testImplementation platform('org.testcontainers:testcontainers-bom:1.21.3')
    implementation libs.springdoc.openapi.starter.webmvc.scalar
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'tools.jackson.core:jackson-databind'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-authorization-server'
}

test {
    useJUnitPlatform()
}
