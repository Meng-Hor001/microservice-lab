plugins {
    id 'spring-boot-common-conventions'
    id 'com.github.node-gradle.node' version '7.1.0'
}

node {
    // Uses Node.js already installed on your machine.
    download = false
    nodeProjectDir = file('../iam-web')
}

tasks.register('buildReact', com.github.gradle.node.npm.task.NpmTask) {
    dependsOn tasks.named('npmInstall')
    args = ['run', 'build']

    inputs.files(fileTree('../iam-web') {
        exclude 'node_modules/**', 'dist/**', '.git/**'
    })
    outputs.dir('../iam-web/dist')
}

tasks.named('processResources') {
    dependsOn tasks.named('buildReact')

    from('../iam-web/dist') {
        into 'static/me'
    }
}

dependencies {
    implementation libs.iam.domain.core
    implementation libs.iam.application.service
    implementation libs.iam.service.persistence
    implementation libs.iam.service.infrstructure
    implementation libs.iam.service.web
    implementation libs.iam.service.restapi


    implementation libs.spring.boot.starter.liquibase
    implementation libs.spring.boot.starter.data.jpa
    runtimeOnly 'org.postgresql:postgresql'


    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
    testImplementation platform('org.testcontainers:testcontainers-bom:1.21.3')
    implementation libs.springdoc.openapi.starter.webmvc.scalar
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'tools.jackson.core:jackson-databind'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-authorization-server'
}

test {
    useJUnitPlatform()
}
