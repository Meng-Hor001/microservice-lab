spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9999
          jwk-set-uri: http://localhost:9999/oauth2/jwks
          audiences:
            - iam-api

      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope:
              - read:user
              - user:email
          facebook:
            client-id: ${FACEBOOK_CLIENT_ID}
            client-secret: ${FACEBOOK_CLIENT_SECRET}
            scope:
              - public_profile
              - email
          telegram:
            provider: telegram
            client-id: ${TELEGRAM_CLIENT_ID}
            client-secret: ${TELEGRAM_CLIENT_SECRET}
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            redirect-uri: https://ovary-kinswoman-tantrum.ngrok-free.dev/login/oauth2/code/telegram
            scope:
              - openid
              - profile
        provider:
          telegram:
            authorization-uri: https://oauth.telegram.org/auth
            token-uri: https://oauth.telegram.org/token
            jwk-set-uri: https://oauth.telegram.org/.well-known/jwks.json
            user-name-attribute: sub

  profiles:
    active: local
  application:
    name: iam-service

  jpa:
    hibernate:
      ddl-auto: validate
  datasource:
    url: ${DB_URL}
    password: ${DB_PASSWORD}
    username: ${DB_USERNAME}
    driver-class-name: org.postgresql.Driver

  liquibase:
    enabled: true
    change-log: db.changelog/db.changelog-master.yaml

server:
  port: 9999

iam:
  registration-client:
    id: ${IAM_REGISTRATION_CLIENT_ID}
    secret: ${IAM_REGISTRATION_CLIENT_SECRET}

logging:
  level:
    org.springframework.security.oauth2.client: DEBUG
gg:
  jte:
    development-mode: true
